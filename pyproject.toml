[project]
name = "ip-resolve-flow"
version = "0.1.0"
description = "A hostname and IP address resolution flow"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ip_resolver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]